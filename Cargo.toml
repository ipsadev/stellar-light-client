[package]
name = "stellar-light-client"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ipsadev/stellar-light-client"
rust-version = "1.81.0"
description = "08-wasm Stellar light client deployable on a Cosmos SDK chain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "2.1", default-features = false, features = ["std"] }
prost = "0.13"
ics23 = { version = "0.12", default-features = false }
sha2 = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "1"
stellar-consensus-verifier = "1.0.1"

[dev-dependencies]
ipsa-ibc-core = "0.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
cw-multi-test = { version = "2", features = ["cosmwasm_2_1"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = 2 }

[lints.clippy]
use_self = "warn"

[profile.release]
lto = true
opt-level = 3
panic = "unwind"
overflow-checks = true
