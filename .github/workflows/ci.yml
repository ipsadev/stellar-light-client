name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: setup just
        uses: extractions/setup-just@v3

      - name: cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-latest-1

      - name: install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: just ci
        run: just ci

  reproducible:
    name: reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build the artifact
        run: ./scripts/release-build.sh dist

      - name: rebuild from a cold cache and compare
        run: |
          cp dist/checksums.txt /tmp/first.txt
          docker volume rm -f stellar-light-client-target
          rm -rf dist
          ./scripts/release-build.sh dist
          if ! diff -u /tmp/first.txt dist/checksums.txt; then
            echo "::error::the light client build is not reproducible"
            exit 1
          fi
          echo "rebuilt byte-identically"
          cat dist/checksums.txt

      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-light-client-wasm
          path: dist/*
          if-no-files-found: error
